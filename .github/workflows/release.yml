name: Release

# Publishing is deliberate: it happens when a version tag is pushed, never on a
# merge. Cut one with `npm version patch && git push --follow-tags`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # npm's trusted publishing: the registry checks a short lived token from
  # GitHub that names this repository and this workflow, so there is no npm
  # token to store, leak or rotate. Provenance is attached automatically, which
  # is what lets anyone verify the tarball was built from this source.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Deliberately without `registry-url`: that writes an npmrc line reading
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token set that expands to
      # an empty one. npm then believes it already has credentials, never asks
      # GitHub for an OIDC token, and the registry answers the anonymous
      # request with a 404. Trusted publishing wants no credentials at all.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No cache in a release build: what is published should come from a
          # clean install of exactly what the lockfile says.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

      # The tag and the version in package.json have to agree, or the tag says
      # one thing and the registry another.
      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          }

      # Trusted publishing needs npm 11.5.1 or newer. The runner usually has it
      # already, so this only reaches for the registry when it does not.
      - name: Ensure npm can use trusted publishing
        run: |
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is older than $need, upgrading"
            npm install -g "npm@>=$need"
          fi
          npm --version

      # What npm will see. The trusted publisher entry on npmjs.com has to name
      # exactly this repository and this workflow, so printing the claim turns
      # "404 Not Found" from the registry, which is what it says when it will
      # not accept the identity, into something you can act on. The token
      # itself is never printed.
      - name: Show how this job will authenticate
        run: |
          echo "registry: $(npm config get registry)"
          # Prints the configured value, not a token: with trusted publishing
          # this has to be empty, or npm will use it instead of asking GitHub.
          echo "configured auth: '$(npm config get //registry.npmjs.org/:_authToken)'"

      - name: Show the identity this job will publish with
        run: |
          claim="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "
              let raw = ''
              process.stdin.on('data', d => raw += d).on('end', () => {
                const token = JSON.parse(raw).value
                const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
                for (const key of ['repository', 'repository_owner', 'workflow_ref', 'ref'])
                  console.log(key + ': ' + claims[key])
              })
            ")"
          echo "$claim"

      # No NODE_AUTH_TOKEN: the OIDC exchange is the authentication.
      - run: npm publish
